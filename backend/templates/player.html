<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест плеера</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .track { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        audio { width: 100%; margin-top: 10px; }
        img { max-width: 100px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🎵 Тест плеера</h1>
    <div id="tracks">Загрузка...</div>

    <script>
        async function loadTracks() {
            const response = await fetch('/api/tracks/');
            const tracks = await response.json();
            
            const container = document.getElementById('tracks');
            container.innerHTML = '';
            
            tracks.forEach(track => {
                const div = document.createElement('div');
                div.className = 'track';
                div.innerHTML = `
                    <h3>${track.title}</h3>
                    <p>Артист: ${track.user} | Жанр: ${track.genre || '—'}</p>
                    ${track.artwork_url ? `<img src="${track.artwork_url}" alt="cover">` : ''}
                    <audio controls src="${track.audio_url}"></audio>
                `;
                container.appendChild(div);
            });
        }
        loadTracks();
    </script>
</body>
</html>
